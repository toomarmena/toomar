name: Supabase

# Applies database migrations and auth settings whenever they change on main.
# Secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SITE_URL: https://toomar.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Push migrations
        run: supabase db push

      - name: Configure mail (Resend SMTP, Arabic templates, confirmation on)
        if: ${{ env.RESEND_API_KEY != '' }}
        run: |
          node .github/scripts/auth-mail.mjs

      - name: Configure auth (site URL, redirects, email confirmation off for now)
        if: ${{ env.RESEND_API_KEY == '' }}
        run: |
          curl --fail-with-body -sS -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(cat <<EOF
          {
            "site_url": "$SITE_URL",
            "uri_allow_list": "$SITE_URL/**,https://*-toomar.vercel.app/**,http://localhost:3000/**,http://localhost:3210/**",
            "mailer_autoconfirm": true,
            "external_email_enabled": true
          }
          EOF
          )"
